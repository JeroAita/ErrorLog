services:

  # --- Kafka (modo KRaft, sin Zookeeper) ---
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Dos listeners de datos, porque hay dos tipos de clientes:
      #   PLAINTEXT     -> red interna de Docker (backend, karafka, kafka-ui)
      #   PLAINTEXT_HOST -> la máquina del host (los producers Python)
      # El puerto publicado (9092) es el host-facing; el interno va en 29092.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 5

  # --- UI web para inspeccionar tópicos y mensajes (opcional, útil para la demo) ---
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # --- Backend Rails: API REST + consumer Karafka ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/rails server -b 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      KAFKA_BROKER: kafka:29092
      RAILS_ENV: development
    volumes:
      - ./backend:/app
    depends_on:
      kafka:
        condition: service_healthy

  # --- Proceso separado que corre el consumer de Karafka ---
  karafka-consumer:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: karafka-consumer
    command: bundle exec karafka server
    environment:
      KAFKA_BROKER: kafka:29092
      RAILS_ENV: development
    volumes:
      - ./backend:/app
    depends_on:
      kafka:
        condition: service_healthy

  # --- Frontend React ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  kafka_data:
